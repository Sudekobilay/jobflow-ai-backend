            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Yeni kullanıcı oluşturur. Email ve şifre ile kayıt yapılır.
      summary: Kullanıcı kaydı
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/cv/:
    get:
      operationId: cv_list
      description: Kullanıcının CV'lerini listeler veya yeni bir CV oluşturur.
      summary: CV Listeleme ve Oluşturma
      tags:
      - Applications
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CV'
          description: ''
    post:
      operationId: cv_create
      description: Kullanıcının CV'lerini listeler veya yeni bir CV oluşturur.
      summary: CV Listeleme ve Oluşturma
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CV'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CV'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CV'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CV'
          description: ''
  /api/cv/{id}/:
    get:
      operationId: cv_retrieve
      description: Kullanıcının belirli bir CV'sini görüntüler, günceller veya siler.
      summary: CV Detayı
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
