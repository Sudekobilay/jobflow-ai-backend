openapi: 3.0.3
info:
  title: JobFlow AI API
  version: 1.0.0
  description: JobFlow AI Backend API Dokümantasyonu
paths:
  /api/ai/match/:
    post:
      operationId: ai_match_create
      description: CV metni ile iş ilanı metnini karşılaştırır ve uyum oranını çıkarır.
      summary: AI eşleşme analizi
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIMatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIMatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIMatch'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIMatchResponse'
          description: ''
  /api/ai/summary/:
    post:
      operationId: ai_summary_create
      description: Verilen metni özetleyen AI endpoint'i.
      summary: AI özeti
      tags:
      - AI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AISummary'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AISummary'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AISummary'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AISummaryResponse'
          description: ''
  /api/applications/:
    get:
      operationId: applications_list
      description: Kullanıcının iş başvurularını listeler veya yeni bir iş başvurusu
        oluşturur.
      summary: İş Başvurusu Listeleme ve Oluşturma
      tags:
      - Applications
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JobApplication'
          description: ''
    post:
      operationId: applications_create
      description: Kullanıcının iş başvurularını listeler veya yeni bir iş başvurusu
        oluşturur.
      summary: İş Başvurusu Listeleme ve Oluşturma
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobApplication'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobApplication'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
          description: ''
  /api/applications/{id}/:
    get:
      operationId: applications_retrieve
      description: Kullanıcının belirli bir iş başvurusunu görüntüler, günceller veya
        siler.
      summary: İş Başvurusu Detayı
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Applications
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
          description: ''
    put:
      operationId: applications_update
      description: Kullanıcının belirli bir iş başvurusunu görüntüler, günceller veya
        siler.
      summary: İş Başvurusu Detayı
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobApplication'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JobApplication'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
          description: ''
    patch:
      operationId: applications_partial_update
      description: Kullanıcının belirli bir iş başvurusunu görüntüler, günceller veya
        siler.
      summary: İş Başvurusu Detayı
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobApplication'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJobApplication'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJobApplication'
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobApplication'
          description: ''
    delete:
      operationId: applications_destroy
      description: Kullanıcının belirli bir iş başvurusunu görüntüler, günceller veya
        siler.
      summary: İş Başvurusu Detayı
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Applications
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: E-posta ve şifre ile kullanıcı girişi yapar ve JWT token döner.
