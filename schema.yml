      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CV'
          description: ''
    put:
      operationId: cv_update
      description: Kullanıcının belirli bir CV'sini görüntüler, günceller veya siler.
      summary: CV Detayı
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CV'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CV'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CV'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CV'
          description: ''
    patch:
      operationId: cv_partial_update
      description: Kullanıcının belirli bir CV'sini görüntüler, günceller veya siler.
      summary: CV Detayı
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCV'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCV'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCV'
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CV'
          description: ''
    delete:
      operationId: cv_destroy
      description: Kullanıcının belirli bir CV'sini görüntüler, günceller veya siler.
      summary: CV Detayı
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Applications
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/jobs/:
    get:
      operationId: jobs_list
      description: Tüm iş ilanlarını listeler.
      summary: İş listesi
      tags:
      - Jobs
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
          description: ''
    post:
      operationId: jobs_create
      description: Tüm iş ilanlarını listeler.
      summary: İş listesi
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Job'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{id}/:
    get:
      operationId: jobs_retrieve
      description: Belirli bir iş ilanının detaylarını gösterir.
      summary: İş detayları
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Jobs
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    put:
      operationId: jobs_update
      description: Belirli bir iş ilanının detaylarını gösterir.
      summary: İş detayları
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Job'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    patch:
      operationId: jobs_partial_update
      description: Belirli bir iş ilanının detaylarını gösterir.
      summary: İş detayları
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJob'
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    delete:
      operationId: jobs_destroy
      description: Belirli bir iş ilanının detaylarını gösterir.
      summary: İş detayları
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Jobs
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '204':
          description: No response body
  /api/profiles/me/:
    get:
      operationId: profiles_me_retrieve
      tags:
      - profiles
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: profiles_me_update
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfile'
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    patch:
      operationId: profiles_me_partial_update
      tags:
      - profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
components:
  schemas:
    AIMatch:
      type: object
      properties:
        cv_text:
          type: string
          description: Adayın CV metni
        job_description:
          type: string
          description: İş ilanı metni
      required:
      - cv_text
      - job_description
    AIMatchResponse:
      type: object
      properties:
        message:
          type: string
        analysis:
          type: string
        match_score:
          type: integer
        status:
          type: string
        error:
          type: string
      required:
      - analysis
      - message
      - status
    AISummary:
      type: object
      properties:
        text:
          type: string
          description: Özetlenecek metin
      required:
      - text
    AISummaryResponse:
      type: object
      properties:
        message:
          type: string
        summary:
          type: string
        status:
          type: string
        error:
          type: string
      required:
      - message
      - status
      - summary
    CV:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        summary:
          type: string
        skills: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
      - updated_at
      - user
    Certificate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        issuer:
          type: string
          nullable: true
          maxLength: 200
      required:
      - id
      - name
    Job:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        title:
          type: string
          maxLength: 200
        company:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
        description:
          type: string
        salary:
          type: string
          maxLength: 100
        is_remote:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - created_at
      - description
      - id
      - title
      - updated_at
      - user
    JobApplication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        job:
          type: integer
        cv:
          type: integer
        status:
          $ref: '#/components/schemas/StatusEnum'
        cover_letter:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - cv
      - id
      - job
      - updated_at
      - user
    Language:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
      required:
      - id
      - name
    Login:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    PatchedCV:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        summary:
          type: string
        skills: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedJob:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        title:
          type: string
          maxLength: 200
        company:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
        description:
          type: string
        salary:
          type: string
          maxLength: 100
        is_remote:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedJobApplication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        job:
          type: integer
        cv:
          type: integer
        status:
          $ref: '#/components/schemas/StatusEnum'
        cover_letter:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedUserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 20
        university:
          type: string
          nullable: true
          maxLength: 200
        department:
          type: string
          nullable: true
          maxLength: 200
        gpa:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
        bio:
          type: string
          nullable: true
        github_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        linkedin_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        experience_years:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
          readOnly: true
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/Certificate'
          readOnly: true
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
          readOnly: true
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 20
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - password
    Skill:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    StatusEnum:
      enum:
      - applied
      - reviewed
      - accepted
      - rejected
      type: string
      description: |-
        * `applied` - Applied
        * `reviewed` - Reviewed
        * `accepted` - Accepted
        * `rejected` - Rejected
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 20
      required:
      - email
      - id
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          nullable: true
          maxLength: 20
        university:
          type: string
          nullable: true
          maxLength: 200
        department:
          type: string
          nullable: true
          maxLength: 200
        gpa:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
        bio:
          type: string
          nullable: true
        github_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        linkedin_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        experience_years:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
          readOnly: true
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/Certificate'
          readOnly: true
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
          readOnly: true
      required:
      - certificates
      - id
      - languages
      - skills
      - user
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
