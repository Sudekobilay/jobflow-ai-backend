events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream django_app {
        server web:8000;
    }

    # Basit HTTP sunucusu (lokal/test amaçlı). TLS/Certbot yapılandırması
    # isteğe bağlıdır ve domain/sertifika hazır olduğunda eklenebilir.
    server {
        listen 80;
        server_name _;  # Catch-all; prod için kendi domaininizi yazın

        # Statik Dosyalar (Django yerine doğrudan Nginx sunar)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Medya Dosyaları
        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # Django API Proxy Yönlendirmesi
        location / {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}